active_space:
  resources_servers:
    active_space:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Choose a quantum-simulation active space for a material, scored by accuracy vs. Toffoli cost
      value: Improve tool-grounded scientific decision making under an accuracy/cost trade-off
active_space_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 8
      resources_server:
        type: resources_servers
        name: active_space
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: train
          type: train
          jsonl_fpath: resources_servers/active_space/data/train.jsonl
          license: Apache 2.0
        - name: validation
          type: validation
          jsonl_fpath: resources_servers/active_space/data/validation.jsonl
          license: Apache 2.0
        - name: example
          type: example
          jsonl_fpath: resources_servers/active_space/data/example.jsonl
# The held-out test split (resources_servers/active_space/data/test.jsonl) is deliberately not
# declared here, so it can never be collated into training data. Evaluate it with
# `gym eval run --no-serve +input_jsonl_fpath=...` (see scripts/run_eval.sh).

active_space_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: active_space_simple_agent
